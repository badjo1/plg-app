    members:
      title: Join the Playground
      subtitle: A space for creators, built by creators. Become a KeyPass holder and help shape the future of the Playground.
      keypass_title: The KeyPass
      keypass_text_1_html: "In May 2023, 17 pioneers joined the Playground by acquiring the first-ever <a href=\"https://app.manifold.xyz/c/playing-the-future\" target=\"_blank\" class=\"text-forest font-semibold underline\">PLAYING THE FUTURE pass</a> — an NFT artwork by Felix LePeintre. This marked the beginning of a shared journey toward securing a permanent home for digital creation in Amsterdam."
      keypass_text_2: "Now, three years later, the Playground has evolved. As a passholder, you are not just a member—you can become a co-creator of this space."
      agenda_title: Access to the Central Agenda
      agenda_text: "Stay connected with everything happening in the Playground, from community events to creative sessions."
      space_title: Use the Space
      space_text: Book the Playground for your projects or underlet it to others under your responsibility.
      decide_title: You Decide Who Joins
      decide_text: Passholders collectively decide who joins the network and shape the shared use of the space.
      more_title: More Than a Membership
      more_text: "While not official yet, keyholders are set to become part of a cooperative-in-the-making, ensuring long-term stewardship of the Playground."
      how_to_join: How to Join?
      step_1: "Get the New KeyPass – Gain access and become part of the Playground's evolution."
      step_2: "Engage & Contribute – Use the space, host events, and help shape the future."
      step_3: "Vote on New Members – As a passholder, you collectively decide who joins next."
      get_key: Get Your Key
      existing_title: Existing Passholders
      existing_text: "If you already hold a PLAYING THE FUTURE pass, you can renew your KeyPass for free or at a discounted rate (final details to be confirmed)."
    governance:
      title: Playground DAO
      subtitle: Govern the Playground together. KeyPass holders decide who uses the space, PLG holders vote on budget and policy.
      join_dao: Join the DAO (STAKE PLG)
      how_title: How does it work?
      keypass_title: "KeyPass = Access & Management"
      keypass_text_1: KeyPass holders decide on the use of the space and who may use it.
      keypass_text_2: They can make proposals for important changes and new initiatives.
      plg_title: PLG Staking = Voting Rights
      plg_text_1: PLG holders vote on proposals from KeyPass holders and decide on budgets and activities.
      plg_text_2: Active voters receive staking rewards.
      decision_title: Decision Making
      decision_keypass: KeyPass holders make proposals about space usage and initiatives.
      decision_plg: PLG stakers vote on these proposals and operational decisions.
      why_title: Why join?
      why_text: Help the Playground grow and have a say in its future.
      why_influence: Influence on decisions
      why_rewards: Rewards for active participation
      why_community: Shape the community
    token:
      title: PLG Token
      subtitle: The digital currency of the Playground. Use PLG for renting space, supporting artists, and paying for drinks and events.
      get_plg: Get PLG
      how_title: How does PLG work?
      how_text: "PLG tokens are managed by keypass holders. They can mint and burn PLG and use it to reserve space in the Playground. Visitors can earn and spend PLG as a loyalty token — perfect for buying beer, art, or access to exclusive events."
      keypass_title: Keypass Holders
      keypass_text: Can mint PLG and use it to book the Playground.
      visitors_title: Visitors & Community
      visitors_text: Earn PLG through events and use it for consumptions and art.
      exchange_title: Exchange & Use
      exchange_text: PLG can be transferred or redeemed within the Playground community.
      what_title: What can you do with PLG?
      what_space: Rent space
      what_art: Pay for art & events
      what_drinks: Beer & other goodies
      nft_title: NFTs & Access
      nft_text: Only keypass holders have full control over PLG. They can distribute, mint, and issue tokens within the Playground.
      nft_access_title: NFT-based access
      nft_access_text: Only keypass holders can mint and manage PLG.
      community_use_title: Community use
      community_use_text: "PLG is used as a loyalty token for visitors, making it easy to buy art and consumptions."
