    stories:
      featured_label: Featured Story
      title: Three Years in the Walenweeshuis
      subtitle: "From May 2022 to August 2025, the NFT Playground called the Walenweeshuis home — a 17th-century orphanage in the heart of Amsterdam, turned into a living lab for digital art, blockchain culture, and community."
      paragraph_1: What started as an experiment became a movement. For over three years, the Walenweeshuis was the place where artists, builders, and curious minds came together to explore the intersection of art, technology, and community.
      paragraph_2: "NFT exhibitions lined the walls of a building that once sheltered children — now sheltering ideas. Crypto drinks on Tuesday nights. Workshops on Wednesday afternoons. Pop-up events that spilled into the courtyard. A space where you could walk in with nothing and walk out with a project, a collaborator, or a completely new perspective."
      paragraph_3: "The chapter at the Walenweeshuis has closed, but what was built there lives on — in the people who connected, the projects that launched, and the culture that grew from within those walls."
      quote: "\"We didn't just exhibit art — we lived it.\""
      quote_by: "— The Playground community"
      timeline: The Timeline
      timeline_1_date: May 2022
      timeline_1_title: Doors Open
      timeline_1_desc: The NFT Playground moves into the Walenweeshuis. First exhibitions go up. The space comes alive.
      timeline_2_date: "2022 — 2023"
      timeline_2_title: Community Takes Root
      timeline_2_desc: Weekly crypto drinks, artist residencies, DAO experiments. A network of creators forms around the space.
      timeline_3_date: "2023 — 2024"
      timeline_3_title: Expanding Horizons
      timeline_3_desc: Cosmolocal launches. Local entrepreneurs discover Web3. The Playground becomes a bridge between worlds.
      timeline_4_date: "2024 — 2025"
      timeline_4_title: Legacy in Motion
      timeline_4_desc: The KeyPass community solidifies. Governance takes shape. The seeds planted at the Walenweeshuis scatter across Amsterdam.
      timeline_5_date: August 2025
      timeline_5_title: A Chapter Closes
      timeline_5_desc: "The Walenweeshuis era ends. The community carries forward — the Playground is not a building, it's a movement."
      cta_title: The story continues.
      cta_text: "The Playground is looking for its next home. The community is still here — still creating, still connecting, still playing the future."
      cta_button: Get Involved
