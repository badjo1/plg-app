      keypass_text_2: Ze kunnen voorstellen doen voor belangrijke wijzigingen en nieuwe initiatieven.
      plg_title: PLG Staking = Stemrecht
      plg_text_1: PLG-houders stemmen over voorstellen van Keypass-houders en beslissen over budgetten en activiteiten.
      plg_text_2: Actieve stemmers ontvangen staking rewards als beloning.
      decision_title: Besluitvorming
      decision_keypass: Keypass-houders maken voorstellen over ruimtegebruik en initiatieven.
      decision_plg: PLG-stakers stemmen over deze voorstellen en operationele beslissingen.
