    stories:
      featured_label: Uitgelicht Verhaal
      title: Drie Jaar in het Walenweeshuis
      subtitle: "Van mei 2022 tot augustus 2025 was de NFT Playground thuis in het Walenweeshuis — een 17e-eeuws weeshuis in het hart van Amsterdam, omgetoverd tot een levend lab voor digitale kunst, blockchaincultuur en community."
      paragraph_1: Wat begon als een experiment werd een beweging. Ruim drie jaar lang was het Walenweeshuis de plek waar kunstenaars, bouwers en nieuwsgierige geesten samenkwamen om het snijvlak van kunst, technologie en community te verkennen.
      paragraph_2: "NFT-tentoonstellingen sierden de muren van een gebouw dat ooit kinderen herbergde — nu herbergde het ideeën. Crypto drinks op dinsdagavond. Workshops op woensdagmiddag. Pop-up events die uitwaaierden over de binnenplaats. Een ruimte waar je met niets kon binnenlopen en vertrekken met een project, een medewerker of een totaal nieuw perspectief."
      paragraph_3: "Het hoofdstuk in het Walenweeshuis is afgesloten, maar wat daar is opgebouwd leeft voort — in de mensen die verbonden raakten, de projecten die werden gelanceerd en de cultuur die groeide vanuit die muren."
      quote: "\"We exposeerden niet alleen kunst — we leefden het.\""
      quote_by: "— De Playground-community"
      timeline: De Tijdlijn
      timeline_1_date: Mei 2022
      timeline_1_title: Deuren Open
      timeline_1_desc: De NFT Playground trekt in het Walenweeshuis. De eerste tentoonstellingen gaan op. De ruimte komt tot leven.
      timeline_2_date: "2022 — 2023"
      timeline_2_title: Community Wortelt
      timeline_2_desc: Wekelijkse crypto drinks, artist residencies, DAO-experimenten. Een netwerk van makers vormt zich rond de ruimte.
      timeline_3_date: "2023 — 2024"
      timeline_3_title: Horizon Verbreden
      timeline_3_desc: Cosmolocal lanceert. Lokale ondernemers ontdekken Web3. De Playground wordt een brug tussen werelden.
      timeline_4_date: "2024 — 2025"
      timeline_4_title: Nalatenschap in Beweging
      timeline_4_desc: De KeyPass-community verstevigt. Governance krijgt vorm. De zaden geplant in het Walenweeshuis verspreiden zich over Amsterdam.
      timeline_5_date: Augustus 2025
      timeline_5_title: Een Hoofdstuk Sluit
      timeline_5_desc: "Het Walenweeshuis-tijdperk eindigt. De community gaat door — de Playground is geen gebouw, het is een beweging."
      cta_title: Het verhaal gaat door.
      cta_text: "De Playground zoekt een nieuw thuis. De community is er nog steeds — nog steeds aan het creëren, verbinden en de toekomst spelen."
