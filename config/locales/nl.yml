      what_title: Wat kun je met PLG?
      what_space: Ruimte huren
      what_art: Kunst & events betalen
      what_drinks: Bier & andere goodies
      nft_title: NFT's & Toegang
      nft_text: Alleen keypassholders hebben volledige controle over PLG. Zij kunnen tokens verdelen, minten en uitgeven binnen de Playground.
      nft_access_title: NFT-gebaseerde toegang
      nft_access_text: Alleen keypassholders kunnen PLG minten en beheren.
      community_use_title: Community gebruik
