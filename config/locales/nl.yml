    members:
      title: Word lid van de Playground
      subtitle: Een ruimte voor makers, gebouwd door makers. Word KeyPass-houder en help de toekomst van de Playground vormgeven.
      keypass_title: De KeyPass
      keypass_text_1_html: "In mei 2023 sloten 17 pioniers zich aan bij de Playground door de allereerste <a href=\"https://app.manifold.xyz/c/playing-the-future\" target=\"_blank\" class=\"text-forest font-semibold underline\">PLAYING THE FUTURE pass</a> te verwerven — een NFT-kunstwerk van Felix LePeintre. Dit markeerde het begin van een gezamenlijke reis naar het veiligstellen van een permanent thuis voor digitale creatie in Amsterdam."
      keypass_text_2: "Nu, drie jaar later, is de Playground geëvolueerd. Als pashouder ben je niet alleen lid—je kunt mede-maker worden van deze ruimte."
      agenda_title: Toegang tot de Centrale Agenda
      agenda_text: "Blijf verbonden met alles wat er in de Playground gebeurt, van community-events tot creatieve sessies."
      space_title: Gebruik de Ruimte
      space_text: Boek de Playground voor je projecten of onderverhuur aan anderen onder jouw verantwoordelijkheid.
      decide_title: Jij beslist wie erbij komt
      decide_text: Pashouders beslissen gezamenlijk wie zich aansluit bij het netwerk en geven vorm aan het gedeelde gebruik van de ruimte.
      more_title: Meer dan een Lidmaatschap
      more_text: "Hoewel nog niet officieel, zijn sleutelhouders bezig onderdeel te worden van een coöperatie-in-wording, die het langdurige beheer van de Playground waarborgt."
      how_to_join: Hoe sluit je aan?
      step_1: "Haal de nieuwe KeyPass – Krijg toegang en word onderdeel van de evolutie van de Playground."
      step_2: "Doe mee & Draag bij – Gebruik de ruimte, organiseer events en help de toekomst vorm te geven."
      step_3: "Stem over nieuwe leden – Als pashouder beslis je collectief wie er als volgende bij komt."
      get_key: Haal je Sleutel
      existing_title: Bestaande Pashouders
      existing_text: "Als je al een PLAYING THE FUTURE pass hebt, kun je je KeyPass gratis of met korting verlengen (definitieve details worden nog bevestigd)."
    governance:
      title: Playground DAO
      subtitle: Beheer samen de Playground. Keypass-houders bepalen wie de ruimte gebruikt, PLG-houders stemmen over budget en beleid.
