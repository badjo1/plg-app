      why_community: Vorm de community
    token:
      title: PLG Token
      subtitle: De digitale valuta van de Playground. Gebruik PLG voor het huren van ruimte, het ondersteunen van kunstenaars en het betalen van drankjes en events.
      get_plg: Get PLG
      how_title: Hoe werkt PLG?
      how_text: "PLG-tokens worden beheerd door keypassholders. Zij kunnen PLG minten en burnen en gebruiken het om ruimte te reserveren in de Playground. Bezoekers kunnen PLG verdienen en besteden als een loyalty token — perfect voor het kopen van bier, kunst of toegang tot exclusieve events."
