      about_title: Wat is de Playground?
      about_text_1: De Playground is een ruimte waar digitale makers, ondernemers en kunstenaars samenkomen om te experimenteren, samen te werken en impact te maken. Het is meer dan een plek; het is een community gebouwd op innovatie, openheid en wederzijdse groei.
      about_text_2: "In de Playground beelden we de toekomst niet alleen in—we spelen haar tot leven. Hier betekent spelen: meebewegen met mogelijkheden in plaats van begrensd te worden door structuur."
